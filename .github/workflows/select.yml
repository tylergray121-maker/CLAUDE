name: copytop leader selection

# Backtests copytop's own copy rules on every candidate sports wallet and
# picks which wallets it should follow (pmbot/select.py). Results go to
# selectresults/ on this branch.

on:
  push:
    branches: [claude/polymarket-copy-backtest]
    paths: ["pmbot/select.py", ".github/workflows/select.yml", "select.args"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: select
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: .cache-select
          key: select-${{ github.run_id }}
          restore-keys: select-

      - name: Tests
        run: python -m unittest tests.test_pmbot

      - name: Backtest copytop on every candidate wallet
        timeout-minutes: 270
        shell: bash -o pipefail {0}
        run: |
          mkdir -p selectresults
          python -u -m pmbot.select $(cat select.args 2>/dev/null) 2>&1 | tee selectresults/run.log | tail -150

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache-select
          key: select-${{ github.run_id }}

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f selectresults
          git commit -m "Leader selection results ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]" || exit 0
          # this run's results win over any earlier run's (e.g. a cancelled one's)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
