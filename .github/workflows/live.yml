name: live trading

# REAL MONEY on Polymarket US. Runs only when started by hand from the
# Actions tab with the confirmation typed in; never on a push. One start runs
# up to four back-to-back segments (GitHub caps a job at 6 hours), about 23
# hours in all; each segment resumes the account from live-desk. The account
# state, scorecard and dashboard snapshot go to the live-desk branch every
# 10 minutes. To stop: add a file named STOP to the live-desk branch (the bot
# halts within a minute and cancels its own orders), or cancel the run.
# Risk limits are in live.args.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: I accept the risk of losing this money'
        required: true
      hours:
        description: "Hours per segment (max 5.75)"
        required: true
        default: "5.75"
      segments:
        description: "Back-to-back segments, 1-4 (4 x 5.75h is about 23 hours)"
        required: true
        default: "4"

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        segment: [1, 2, 3, 4]
    env:
      REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      PMUS_KEY_ID: ${{ secrets.PMUS_KEY_ID }}
      PMUS_SECRET_KEY: ${{ secrets.PMUS_SECRET_KEY }}
      # Optional: The Odds API key for the evsniper strategy (Pinnacle fair odds).
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CONFIRM: ${{ inputs.confirm }}
      HOURS: ${{ inputs.hours }}
      SEGMENTS: ${{ inputs.segments }}
      SEGMENT: ${{ matrix.segment }}
    steps:
      - name: Check the confirmation and keys
        run: |
          if [ "$SEGMENT" -gt "${SEGMENTS:-1}" ]; then
            echo "Segment $SEGMENT not requested (segments=$SEGMENTS)."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          if [ "$CONFIRM" != "I accept the risk of losing this money" ]; then
            echo "Confirmation not typed exactly; not trading."; exit 1; fi
          if [ -z "$PMUS_KEY_ID" ] || [ -z "$PMUS_SECRET_KEY" ]; then
            echo "Add the PMUS_KEY_ID and PMUS_SECRET_KEY repository secrets first."; exit 1; fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - name: Install the Polymarket US SDK
        if: env.SKIP != '1'
        run: pip install -q polymarket-us==2.4.1

      - name: Tests
        if: env.SKIP != '1'
        run: python -m unittest tests.test_pmbot

      - name: Restore the live desk
        if: env.SKIP != '1'
        id: restore
        run: |
          mkdir -p live
          if git fetch -q origin live-desk 2>/dev/null; then
            git show origin/live-desk:state.json > live/state.json 2>/dev/null || rm -f live/state.json
            git show origin/live-desk:live_orders.json > live/live_orders.json 2>/dev/null || true
            if git show origin/live-desk:STOP >/dev/null 2>&1; then echo "stop=1" >> "$GITHUB_OUTPUT"; fi
          fi
          ls -la live

      - name: Trade live and publish snapshots
        if: env.SKIP != '1' && steps.restore.outputs.stop != '1'
        timeout-minutes: 350
        shell: bash
        run: |
          MIN=$(python -c "import os; print(int(min(5.75, max(0.1, float(os.environ['HOURS']))) * 60))")
          publish() {
            rm -rf /tmp/ld && mkdir -p /tmp/ld
            for f in state.json paper.json report.md summary.json live_orders.json; do
              [ -f "live/$f" ] && cp "live/$f" /tmp/ld/
            done
            tail -400 live/run.log > /tmp/ld/run_tail.log 2>/dev/null || true
            (cd /tmp/ld && git init -q && git checkout -q -b live-desk && git add -A &&
             git -c user.name="github-actions[bot]" \
                 -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                 commit -qm "Live snapshot $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" &&
             git push -qf "$REPO_URL" live-desk) || echo "publish failed"
          }
          python -u -m pmbot live --yes --resume --out-dir live --kill-file live/STOP \
            --minutes "$MIN" $(cat live.args) > live/run.log 2>&1 &
          BOT=$!
          n=0
          while kill -0 $BOT 2>/dev/null; do
            sleep 60; n=$((n + 1))
            # A STOP file on the live-desk branch halts the bot (it cancels its orders).
            if git fetch -q origin live-desk 2>/dev/null && git show origin/live-desk:STOP >/dev/null 2>&1; then
              touch live/STOP; echo "STOP found on live-desk"; fi
            if [ $((n % 10)) -eq 0 ]; then publish; grep -v " live " live/run.log | tail -3 || true; fi
          done
          STATUS=0
          wait $BOT || STATUS=$?
          publish
          tail -30 live/run.log || true
          exit $STATUS
